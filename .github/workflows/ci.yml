name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Build, test and evaluate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      PROVIDER: mock
      GEMINI_API_KEY: ""
      GEMINI_MODEL: gemini-2.5-flash
      GEMINI_TIMEOUT_MS: 30000
      STRICT_MOCK_RESPONSE_VALIDATION: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Validate scenarios
        run: npm run validate

      - name: Run mock evaluation
        run: npm run evaluate
